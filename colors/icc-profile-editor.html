// -

function invoke(fn) {
   return fn();
}

function range(n) {
   return Array(n).keys();
}

function panic(v) {
   throw v;
}

function map_key_by_value(value_by_key) {
   const key_by_value = {};
   Object.entries(value_by_key).forEach(
      ([k,v]) => {
         key_by_value[v] = k;
      }
   );
   return key_by_value;
}

// -

function Fuse(max_count) {
   this.count = 0;
   this.tick = function() {
      this.count += 1;
      if (this.count >= max_count) throw max_count;
   };
}
const FUSE = new Fuse(300*1000);

// -

function StrEnum(name, valid_values) {
   this.constructor.name = name;
   for (const v of valid_values) {
      this[v] = v;
   }
   this.From = function(value) {
      if (!valid_values.includes(value)) throw {name, value, valid_values};
      return value;
   };
}

const Endianness = new StrEnum('Endianness', ['big', 'little']);
const IccProfileClass = new StrEnum('IccProfileClass', [
   'scnr',
   'mntr',
   'prtr',
   'link',
   'spac',
   'abst',
   'nmcl',
]);

// -

function data_view_from_view(view) {
   return new DataView(
      view.buffer,
      view.byteOffset,
      view.byteLength);
}

function bytes_from_view(view) {
   return new Uint8Array(
      view.buffer,
      view.byteOffset,
      view.byteLength);
}

// -

class ViewDeserializer {
   constructor(desc) {
      desc.types.defined;
      if (!desc.data_view && desc.data_view !== null) {
         throw desc;
      }
      Object.assign(this, {
         byte_offset: 0,
         _pop_depth: 0,
      }, desc);
      this._test_deser = null;
   }

   clone() {
      return new ViewDeserializer(this);
   }

   subview(start, end) {
      console.log(this, `.subview(`, {start, end}, `)`);
      start = start || 0;
      const ret = this.clone();

      let bytes = bytes_from_view(ret.data_view);
      bytes = bytes.subarray(start, end);
      ret.data_view = data_view_from_view(bytes);
      ret.byte_offset = 0;
      return ret;
   }

   subview_n(start, n) {
      console.log(this, `.subview_n(`, {start, n}, `)`);
      start = start || 0;
      return this.subview(start, start+n);
   }

   has_bytes(n) {
      if (n === undefined) {
         n = 1;
      }
      if (!this.data_view) return true;
      const remaining = this.data_view.byteLength - this.byte_offset;
      return n <= remaining;
   }

   pad_to_alignment(n) {
      const tail = this.byte_offset % n;
      const indent = this.indent();
      console.log(`${indent}ViewDeserializer<${this.data_view && this.data_view.byteOffset}>.pad_to_alignment(${n}) @+${this.byte_offset}`);
      if (tail) {
         this.byte_offset += n - tail;
      }
      console.log(`${indent}| => @+${this.byte_offset}`);
   }

   view_n(n) {
      if (!this.data_view) return new Uint8Array(n);
      let bytes = bytes_from_view(this.data_view);
      bytes = bytes.subarray(this.byte_offset);
      bytes = bytes.subarray(0, n);
      return bytes;
   }

   pop_bytes(n) {
      if (!this.has_bytes(n)) return null;

      const ret = this.view_n(n);
      ret.byte_size = ret.byteLength;

      this.byte_offset += ret.byte_size;
      return ret;
   }

   indent() {
      const TAB = '|  ';
      return TAB.repeat(this._pop_depth % 10);
   }

   pop(type) {
      if (!type) throw type;
      if (typeof(type) == 'string') {
         type = this.types.get_type(type);
      }
      /*
      let log = () => {
         const indent = this.indent();
         let args = [].slice.call(arguments);
         console.log({args});
         if (indent) {
            args.unshift(indent.slice(0,indent.length-1));
         }
         console.log(...args);
      };
      */
      const log = !(type.name == 'utf16' || type.name == 'u16');

      const byte_offset_start = this.byte_offset;
      if (log) console.log(`${this.indent()}ViewDeserializer<${this.data_view.byteOffset}>.pop(${type.name}) @+${this.byte_offset}`);
      FUSE.tick();

      this._pop_depth += 1;
      const ret = type.pop(this);
      console.assert(ret !== undefined, type.name);
      this._pop_depth -= 1;

      if (log) console.log(`${this.indent()}=> ${type.name}`, ret);

      // -
      // Check that push works!

      const byte_offset_end = this.byte_offset;
      const byte_size = byte_offset_end - byte_offset_start;

      if (!this._test_deser) {
         this._test_deser = this.clone();
         // Make a copy of the data array.
         let bytes = bytes_from_view(this._test_deser.data_view);
         bytes = bytes.slice();
         bytes.fill(0);
         this._test_deser.data_view = data_view_from_view(bytes);
         if (this._test_deser.data_view.byteLength != this.data_view.byteLength) throw 9;
      }
      const test_deser = this._test_deser;
      if (this._test_deser.data_view.byteLength != this.data_view.byteLength) throw {test_deser, this:this};

      test_deser.byte_offset = byte_offset_start;
      const output_bytes = test_deser.view_n(byte_size);

      this.byte_offset = byte_offset_start;
      const input_bytes = this.view_n(byte_size);
      if (log) console.log(`${this.indent()}`, {input_bytes, output_bytes});
      this.byte_offset = byte_offset_end;

      // Ensure still zeroed.
      output_bytes.forEach((v,i) => {
         if (v) throw {v, i, output_bytes, this:this};
      });

      // Push!
      if (log) console.log(`${this.indent()}`, 'pre-push', type, ret, test_deser.byte_offset, byte_offset_start);
      console.assert(type.push, type);
      type.push(test_deser, ret);
      if (log) console.log(`${this.indent()}`, 'post-push', type, test_deser.byte_offset, byte_offset_end, this.byte_offset);

      // Check that we ended in the same place.
      if (test_deser.byte_offset != this.byte_offset) {
         throw {test_deser, this:this};
      }
      // Check for match.
      for (const i in output_bytes) {
         let expected = input_bytes[i];
         let was = output_bytes[i];
         if (was != expected) {
            for (const ii in output_bytes) {
               expected = input_bytes[ii];
               was = output_bytes[ii];
               console.log(ii, was == expected, was, expected);
               if (was != expected) break;
            }
            Object.assign(window, {input_bytes, output_bytes});
            throw {i, input_bytes, output_bytes};
         }
      }
      output_bytes.fill(0); // Re-zero.

      return ret;
   }

   push(type, val) {
      if (!type) throw type;
      if (typeof(type) == 'string') {
         type = this.types.get_type(type);
      }

      const indent = this.indent();
      let log = function() { console.log(...arguments); }
      if (['utf16', 'u16', 'zero'].includes(type.name)) {
         log = () => undefined;
      }
      log(`${indent}ViewDeserializer<${this.data_view && this.data_view.byteOffset}>.push(${type.name},`, val, `) @+${this.byte_offset}`);

      this._pop_depth += 1;
      type.push(this, val);
      this._pop_depth -= 1;

      log(`${indent}=> @+${this.byte_offset}`);
   }
}

const NATIVE_ENDIAN = invoke(() => {
   const native_u16 = new Uint16Array([0x01]);
   const dv = new DataView(native_u16.buffer);
   const first_byte = dv.getUint8(0);
   if (first_byte == 0x01) return 'little';
   return 'big';
});

// -

function PrimType(type_name, endian) {
   endian.defined;
   endian = Endianness.From(endian);
   const as_little_endian = (endian == 'little');

   const BASE_TYPE_BY_TYPE = {
      'zero': 'u8',
      'utf16': 'u16',
   };

   let base_type = BASE_TYPE_BY_TYPE[type_name] || type_name;

   const INFO_BY_BASE_TYPE = {
      'i8': {byte_size: 1, long_type: 'Int8'},
      'u8': {byte_size: 1, long_type: 'Uint8'},
      'i16': {byte_size: 2, long_type: 'Int16'},
      'u16': {byte_size: 2, long_type: 'Uint16'},
      'i32': {byte_size: 4, long_type: 'Int32'},
      'u32': {byte_size: 4, long_type: 'Uint32'},
      'i64': {byte_size: 8, long_type: 'BigInt64'},
      'u64': {byte_size: 8, long_type: 'BigUint64'},
      'f16': {byte_size: 2, long_type: 'Float16'},
      'f32': {byte_size: 4, long_type: 'Float32'},
      'f64': {byte_size: 8, long_type: 'Float64'},
   };
   const INFO = INFO_BY_BASE_TYPE[base_type];
   if (!INFO) throw {base_type};
   this.byte_size = INFO.byte_size;

   if (endian == NATIVE_ENDIAN || INFO.byte_size == 1) {
      const typed_array_name = `${INFO.long_type}Array`;
      this.typed_array_type = window[typed_array_name];
   }

   // -

   const fn_set = (deser, value) => DataView.prototype['set' + INFO.long_type].call(deser.data_view, deser.byte_offset, value, as_little_endian);
   const fn_get = deser => DataView.prototype['get' + INFO.long_type].call(deser.data_view, deser.byte_offset, as_little_endian);
/*
   this.value = function(data_view, byte_offset, value) {
      if (value !== undefined) {
         setter.call(data_view, byte_offset, value, as_little_endian);
      }
      return getter.call(data_view, byte_offset, as_little_endian);
   };
   this.view = function(view_deser) {
      const byte_offset = view_deser.byte_offset;
      return set_value => this.value(view_deser.data_view, byte_offset, set_value);
   };
*/
   this.push = function(deser, value) {
      if (deser.data_view) {
         fn_set(deser, value);
      }
      deser.byte_offset += INFO.byte_size;
   };
   this.pop = function(deser) {
      if (!deser.has_bytes(INFO.byte_size)) return null;
      let ret = fn_get(deser);
      deser.byte_offset += INFO.byte_size;
      return ret;
   };
}

function FixedPointType(whole_type_name, fract_type_name) {
   const fract_type = new PrimType(fract_type_name, 'big');
   const fract_divisor = Math.pow(0x100, fract_type.byte_size);

   this.push = function(deser, src) {
      const whole = Math.floor(src); // -1.5 => -2
      const fract = src - whole;
      const fract_bits = Math.round(fract * fract_divisor);
      console.assert(fract >= 0, fract);
      deser.push(whole_type_name, whole);
      deser.push(fract_type_name, fract_bits);
   };

   this.pop = function(deser) {
      const whole = deser.pop(whole_type_name);
      const fract_bits = deser.pop(fract_type_name);
      const ret = whole + (fract_bits / fract_divisor);
      //console.log({whole, fract_bits, ret});
      return ret;
   };
}

function ArrayType(elem_type, elem_count) {
   Object.assign(this, {elem_type, elem_count});

   this.push = function(deser, src) {
      if (src === undefined) {
         if (this.elem_type.name == 'zero') {
            src = new Uint8Array(this.elem_count);
         }
      }
      if (this.elem_type.name == 'utf16') {
         src = [].map.call(src, c => c.charCodeAt());
      }
      let n = src.length;
      if (this.elem_count >= 0) { // Handles NaN
         n = this.elem_count;
      }
      console.log({src});
      console.log('record p array push', {n, this:this, src:src.slice()});
      let ii = 0;
      for (const i of range(n)) {
         //console.log('record p', {src,i,v:src[i]});
         deser.push(this.elem_type, src[i]);
         ii += 1;
      }
      console.log('record p array push ii', {ii});
   };

   this.pop = function(deser) {
      let ret = invoke(() => {
         const typed_array_type = this.elem_type.typed_array_type;
         if (typed_array_type) {
            const byte_size = this.elem_count * this.elem_type.byte_size; // Or 0 if dynamic.
            const bytes = deser.pop_bytes(byte_size || undefined);
            const ret = new typed_array_type(bytes.buffer, bytes.byteOffset, this.elem_count || undefined);
            if (this.elem_type.name == 'zero') {
               ret._reserved = true;
            }
            return ret;
         }

         if (this.elem_count) {
            let ret = Array(this.elem_count).fill().map(
               () => deser.pop(this.elem_type)
            );
            if (ret.length != this.elem_count) throw {this:this, ret};
            return ret;
         }

         const ret = [];
         while (deser.has_bytes()) {
            const v = deser.pop(this.elem_type);
            ret.push(v);
         }
         return ret;
      });
      if (this.elem_type.name == 'utf16') {
         ret = String.fromCharCode(...ret);
      }
      return ret;
   };
}

function AsciiType(byte_size) {
   Object.assign(this, {byte_size});

   this.push = function(deser, val) {
      const byte_view = deser.pop_bytes(this.byte_size || val.length);
      byte_view.set([].map.call(val, c => c.charCodeAt(0)));
      byte_view.fill(0x00, val.length);
   };

   this.pop = function(deser) {
      const byte_view = deser.pop_bytes(this.byte_size || undefined);
      let ret = String.fromCharCode(...byte_view);
      ret = ret.replaceAll('\0', '');
      return ret;
   };
}

function StructType(field_type_by_name) {
   field_type_by_name = Object.assign({}, field_type_by_name);
   Object.assign(this, {field_type_by_name});

   this.push = function(view_serializer, val) {
      for (const [field_name, field_type] of Object.entries(field_type_by_name)) {
         const field_val = val[field_name];
         view_serializer.push(field_type, field_val);
      }
   };

   this.pop = function(view_serializer) {
      const ret = {};
      for (const [field_name, field_type] of Object.entries(field_type_by_name)) {
         console.log({field_name, field_type});
         const field_val = view_serializer.pop(field_type);
         if (!field_val._reserved) {
            ret[field_name] = field_val;
         }
      }
      return ret;
   };
}

function TypeContext(default_endian) {
   this.default_endian = default_endian && Endianness.From(default_endian);

   this.type_by_name = {};

   this.add_type = function(type_name, schema) {
      console.log('add_type', {type_name, schema});
      let type = this.type_by_name[type_name];
      if (type) throw {type_name, type};
      type = invoke(() => {
         if (typeof(schema) == 'object') {
            if (typeof(schema.pop) == 'function') return schema;
            return this._parse_struct(schema);
         }

         return this.get_type(schema);
      });
      type = Object.assign({}, type);
      this._set_type_name(type, type_name);
      return this.type_by_name[type_name] = type;
   }

   this._set_type_name = function(type, type_name) {
      type.name = type_name;
      if (typeof(type.pop) == 'function') {
         Object.defineProperty(type.pop, 'name', {
            value: `popp$<${type_name}>`,
         });
      }
      if (typeof(type.push) == 'function') {
         Object.defineProperty(type.push, 'name', {
            value: `push<${type_name}>`,
         });
      }
      console.log(type.name, type.pop.name);
   }

   this.add_types = function(schema_by_type_name) {
      const type_by_type_name = {};
      for (const [type_name, schema] of Object.entries(schema_by_type_name)) {
         type_by_type_name[type_name] = this.add_type(type_name, schema);
      }
      return type_by_type_name;
   }

   this.get_type = function(type_name) {
      //console.log('get_type', {type_name, type_by_name: this.type_by_name});
      const cached = this.type_by_name[type_name];
      if (cached) return cached;

      const type = this._parse_type(type_name);
      this._set_type_name(type, type_name);
      return this.type_by_name[type_name] = type;
   }

   this._parse_struct = function(field_type_name_by_name) {
      const field_type_by_name = {};
      for (const [field_name, field_type_name] of Object.entries(field_type_name_by_name)) {
         const field_type = this.get_type(field_type_name);
         field_type_by_name[field_name] = field_type;
      }
      return new StructType(field_type_by_name);
   }

   this._parse_type = function(type_name) {
      //console.log('_parse_type', {type_name});
      if (type_name.endsWith(']')) {
         const m = type_name.match(/(.+)[[](.*)]/);
         if (!m) throw {type_name};
         const elem_type_name = m[1];
         const elem_count = parseInt(m[2]);

         if (elem_type_name == 'ascii') {
            return new AsciiType(elem_count);
         }

         const elem_type = this.get_type(elem_type_name);
         return new ArrayType(elem_type, elem_count);
      }

      const basic_type_name = type_name;
      let endian = this.default_endian;
      if (type_name.endsWith('be')) {
         endian = Endianness.big;
         basic_type_name = type_name.slice(0, type_name.length - 2);
      } else if (type_name.endsWith('le')) {
         endian = Endianness.little;
         basic_type_name = type_name.slice(0, type_name.length - 2);
      }
      return new PrimType(basic_type_name, endian);
   };

   this.calc_push_byte_size = function(type_name, val) {
      const deser = new ViewDeserializer({types: this, data_view: null});
      deser.push(type_name, val);
      return deser.byte_offset;
   };
}

      reserved: 'zero[28]',
   },
   TagTableEntry: {

      type_sig: 'ascii[4]',
      reserved: 'zero[4]',
   },
   TagType: {
      pop: tag_viewer => {
         const peek = tag_viewer.clone();
         const tag_head = peek.pop('TagHeader');
         const type_sig = tag_head.type_sig;

         const tag_type = IccProfile.TAG_TYPE_BY_TYPE_SIG[type_sig] || 'UnknownTagType';
         const tag = tag_viewer.pop(tag_type);
         if (tag_type == 'UnknownTagType') {
            console.warn(`Unknown type_sig '${tag.head.type_sig}':`, tag);
            function is_char_code_ascii(c) {
               return 0x20 <= c && c <= 127;
            };
            const char_codes = [].map.call(tag.head.type_sig, c => c.charCodeAt());
            char_codes.forEach(c => {
               if (!is_char_code_ascii(c)) throw char_codes;

         return tag;
      },

         const type_sig = tag.head.type_sig;
         const tag_type = IccProfile.TAG_TYPE_BY_TYPE_SIG[type_sig] || 'UnknownTagType';
         tag_deser.push(tag_type, tag);
      },

      data: 'u8[]',
   },

      pop: deser => {
         deser.pad_to_alignment(4);
         return deser.pop('TagType');
      },
      push: (deser, tag) => {
         deser.pad_to_alignment(4);
         deser.push('TagType', tag);
      }
   },
   multiLocalizedUnicodeRecord: {
      lang_code: 'ascii[2]',
      country_code: 'ascii[2]',

      head: 'TagHeader',

   multiLocalizedUnicodeType: {
      pop: tag_deser => {
         const tag = tag_deser.pop('multiLocalizedUnicodeType_Partial');
         console.assert(tag.record_size == 12, tag);
         const records_t = `multiLocalizedUnicodeRecord[${tag.num_records}]`;
         const records = tag_deser.pop(records_t);
         const str_by_lang_country_code = {};
         records.forEach(record => {
            FUSE.tick();
            const lang_country_code = `${record.lang_code}-${record.country_code}`;
            const str_deser = tag_deser.subview_n(record.string_offset, record.string_length);
            const str = str_deser.pop(`utf16[]`);
            console.log(7, str);
            console.log('record pop', {record, str});
            str_by_lang_country_code[lang_country_code] = str;
         });
         tag_deser.pop_bytes(); // skip to end of tag
         tag.str_by_lang_country_code = str_by_lang_country_code;
         return tag;
      },

      push: (tag_deser, tag) => {
         const tag_start_offset = tag_deser.byte_offset;
         const records = Object.entries(tag.str_by_lang_country_code).map(
            ([lang_country_code, str]) => {
               console.log({lang_country_code});
               const [lang_code, country_code] = lang_country_code.split('-');
               const record = {
                  lang_code,
                  country_code,
                  str,
                  string_length: NaN,
                  string_offset: NaN,
               };
               console.log('record pre', record);
               return record;
            }
         );
         tag.num_records = records.length;
         tag.record_size = 12;
         tag_deser.push('multiLocalizedUnicodeType_Partial', tag);
         const records_t = `multiLocalizedUnicodeRecord[${tag.num_records}]`;
         const records_pass2_deser = tag_deser.clone();
         if (tag_deser.byte_offset != records_pass2_deser.byte_offset) throw {tag_deser, records_pass2_deser};
         console.log(53, {records});
         tag_deser.push(records_t, records);
         records.forEach(record => {
            // JS .length is utf16 len not unicode len.
            const n = record.str.length;
            const str_t = `utf16[${n}]`;
            record.string_offset = tag_deser.byte_offset - tag_start_offset;
            console.log('record pmid', record);
            tag_deser.push(str_t, record.str);
            const end_offset = tag_deser.byte_offset - tag_start_offset;
            record.string_length = end_offset - record.string_offset;
            console.log('record post', str_t, record.string_length, tag_deser.byte_offset, tag, record);
         });
         records_pass2_deser.push(records_t, records);
      },
   },

   parametricCurveType: {

      pop: function(deser) {

   lutAToBType_CLUT_Partial: {
      grid_points_by_dim: 'u8[16]',
      elem_byte_count: 'u8',
      reserved: 'zero[3]',
      // values: (u8 or u16)[n]
   },
   lutAToBType_Partial: {
      head: 'TagHeader',
      num_input_channels: 'u8',
      num_output_channels: 'u8',
      reserved: 'zero[2]',
      b_curve_offset: 'u32',
      matrix_offset: 'u32',
      m_curve_offset: 'u32',
      clut_offset: 'u32',
      a_curve_offset: 'u32',
      // data: 'u8[]',
   },
   lutAToBType: { // Also handles lutBToAType
      n_by_name: function(tag) {
         const n_by_name = {};
         if (tag.head.type_sig == 'mAB ') {
            n_by_name.a_curves = tag.num_input_channels;
            n_by_name.m_curves = tag.num_output_channels;
            n_by_name.b_curves = tag.num_output_channels;
         } else if (tag.head.type_sig == 'mBA ') {
            n_by_name.b_curves = tag.num_input_channels;
            n_by_name.m_curves = tag.num_input_channels;
            n_by_name.a_curves = tag.num_output_channels;
         } else {
            throw tag;
         }
         return n_by_name;
      },
      pop: function(deser) {
         const tag = deser.pop('lutAToBType_Partial');
         const n_by_name = this.n_by_name(tag);
         console.log('lutAToBType pop', {tag});

         // -

         if (tag.a_curve_offset) {
            const offset_deser = deser.subview(tag.a_curve_offset);
            tag.a_curves = Array(n_by_name.a_curves).fill().map(
               () => offset_deser.pop('AlignedTagType')
            );
         }

         if (tag.clut_offset) {
            const offset_deser = deser.subview(tag.clut_offset);
            const clut = offset_deser.pop('lutAToBType_CLUT_Partial');
            console.log('partial_.pop lutAToBType_CLUT_Partial', offset_deser.byte_offset);

            clut.grid_points_by_dim = clut.grid_points_by_dim.slice(0, tag.num_input_channels);
            const box = {
               values_count: tag.num_output_channels,
            };
            clut.grid_points_by_dim.forEach(v => {
               box.values_count *= v;
            });

            const elem_t = (clut.elem_byte_count == 2) ? 'u16' : 'u8';
            const values_t = `${elem_t}[${box.values_count}]`;
            const unorm_values = offset_deser.pop(values_t);
            const divisor = Math.pow(0x100, clut.elem_byte_count) - 1;
            console.log('pop clut.values unorm', unorm_values.slice());
            clut.values = [].map.call(unorm_values, v => v / divisor);
            console.log('pop clut.values float', clut.values.slice());
            console.log('partial_.pop values', values_t, offset_deser.byte_offset);

            tag.clut = clut;
         }

         if (tag.m_curve_offset) {
            const offset_deser = deser.subview(tag.m_curve_offset);
            tag.m_curves = Array(n_by_name.m_curves).fill().map(
               () => offset_deser.pop('AlignedTagType')
            );
         }

         if (tag.matrix_offset) {
            console.assert(tag.num_output_channels == 3, tag);
            const offset_deser = deser.subview(tag.matrix_offset);
            tag.matrix = offset_deser.pop(`s15Fixed16Number[12]`);
         }

         if (tag.b_curve_offset) {
            const offset_deser = deser.subview(tag.b_curve_offset);
            tag.b_curves = Array(n_by_name.b_curves).fill().map(
               () => offset_deser.pop('AlignedTagType')
            );
         }

         // -

         console.assert(!tag.a_curves == !tag.clut, tag);
         if (!tag.clut) {
            console.assert(tag.num_input_channels == tag.num_output_channels, tag);
         }
         console.assert(!tag.m_curves == !tag.matrix, tag);
         if (tag.matrix) {
            console.assert(tag.num_output_channels == 3, tag);
         }
         console.assert(tag.b_curves, tag);

         deser.pop_bytes(); // seek to end of tag.

         console.log('partial_pass2_deser.pop', tag);
         return tag;
      },
      push: function(deser, tag) {
         const tag_start_offset = deser.byte_offset;
         console.assert(!tag.a_curves == !tag.clut, tag);
         if (!tag.clut) {
            console.assert(tag.num_input_channels == tag.num_output_channels, tag);
         }
         console.assert(!tag.m_curves == !tag.matrix, tag);
         if (tag.matrix) {
            console.assert(tag.num_output_channels == 3, tag);
         }
         console.assert(tag.b_curves, tag);

         // -

         const n_by_name = this.n_by_name(tag);
         const partial_pass2_deser = deser.clone();
         deser.push('lutAToBType_Partial', tag);
         console.log('lutAToBType_Partial push pre', {tag});

         // -

         const parts = [];
         if (tag.a_curves) {
            parts.push([tag.a_curve_offset, () => {
               deser.pad_to_alignment(4);
               tag.a_curve_offset = deser.byte_offset - tag_start_offset;

               if (tag.a_curves.length != n_by_name.a_curves) throw tag;
               tag.a_curves.forEach(
                  curve => deser.push('AlignedTagType', curve)
               );
            }]);
         }

         if (tag.clut) {
            parts.push([tag.clut_offset, () => {
               deser.pad_to_alignment(4);
               tag.clut_offset = deser.byte_offset - tag_start_offset;

               const clut = tag.clut;
               deser.push('lutAToBType_CLUT_Partial', clut);

               if (clut.grid_points_by_dim.length != tag.num_input_channels) throw tag;
               const box = {
                  values_count: tag.num_output_channels,
               };
               clut.grid_points_by_dim.forEach(v => {
                  box.values_count *= v;
               });
               if (clut.values.length != box.values_count) throw {tag, values_count: box.values_count};
               const elem_t = (clut.elem_byte_count == 2) ? 'u16' : 'u8';
               const values_t = `${elem_t}[${box.values_count}]`;
               const divisor = Math.pow(0x100, clut.elem_byte_count) - 1;
               console.log('push clut.values float', clut.values.slice());
               const unorm_values = [].map.call(clut.values, v => Math.round(v * divisor));
               console.log('push clut.values unorm', unorm_values.slice());
               deser.push(values_t, unorm_values);
               console.log('partial_.push values', deser.byte_offset - tag.clut_offset);
            }]);
         }

         if (tag.m_curves) {
            parts.push([tag.m_curve_offset, () => {
               deser.pad_to_alignment(4);
               tag.m_curve_offset = deser.byte_offset - tag_start_offset;

               if (tag.m_curves.length != n_by_name.m_curves) throw tag;
               tag.m_curves.forEach(
                  curve => deser.push('AlignedTagType', curve)
               );
            }]);
         }

         if (tag.matrix) {
            parts.push([tag.matrix_offset, () => {
               deser.pad_to_alignment(4);
               tag.matrix_offset = deser.byte_offset - tag_start_offset;

               deser.push(`s15Fixed16Number[12]`, tag.matrix);
            }]);
         }

         if (tag.b_curves) {
            parts.push([tag.b_curve_offset, () => {
               deser.pad_to_alignment(4);
               tag.b_curve_offset = deser.byte_offset - tag_start_offset;

               if (tag.b_curves.length != n_by_name.b_curves) throw tag;
               tag.b_curves.forEach(
                  curve => deser.push('AlignedTagType', curve)
               );
            }]);
         }

         tag.a_curve_offset = 0;
         tag.clut_curve_offset = 0;
         tag.m_curve_offset = 0;
         tag.matrix_offset = 0;
         tag.b_curve_offset = 0;

         // Sort and write out in order of offsets
         parts.sort((a,b) => a[0] - b[0]);
         parts.forEach(([offset, fn]) => fn());

         // -
         partial_pass2_deser.push('lutAToBType_Partial', tag);
         console.log('lutAToBType_Partial push post', {tag});
      },
   },

         deser.pop_bytes(); // Skip to end!

      },
      push: (deser, profile) => {
         const tag_by_tag_sig = profile.tag_by_tag_sig;

            ([tag_sig,tag]) => {

         profile.header.profile_size = deser.byte_offset;

IccProfile.from_bytes = function(view) {
   const deser = new ViewDeserializer({
      data_view: data_view_from_view(view), types: IccProfile.TYPES,
   });

   const profile = window.profile = deser.pop('IccProfile');
   return profile;
}
IccProfile.to_bytes = function(profile) {
   const size_probe_deser = new ViewDeserializer({
      data_view: null, types: IccProfile.TYPES,
   });
   size_probe_deser.push('IccProfile', profile);

   const bytes = new Uint8Array(size_probe_deser.byte_offset);
   const deser = new ViewDeserializer({
      data_view: data_view_from_view(bytes), types: IccProfile.TYPES,
   });
   deser.push('IccProfile', profile);
   return bytes;
}

function download_blob(filename, blob) {
   const url = URL.createObjectURL(blob);

   const link = document.createElement('a');
   link.href = url;
   link.download = filename;
   document.body.appendChild(link);
   link.click();

   document.body.removeChild(link);
   URL.revokeObjectURL(url);
}

function hex_from_view(view) {
   const bytes = bytes_from_view(view);
   const parts = [].map.call(bytes,
      v => {
         v = v.toString(16);
         while (v.length < 2) {
            v = '0' + v;
         }
         return v;
      }
   );
   const hex = parts.join('');
   return hex;
}

e_import.addEventListener('input', async e => {
   if (!e_import.files.length)
      return;
   const f = e_import.files[0];

   const bytes = new Uint8Array(await f.arrayBuffer());
   const hash_bytes = new Uint8Array(await crypto.subtle.digest('sha-256', bytes));
   const hash_str = hex_from_view(hash_bytes);
   e_import_hash.textContent = `(sha-256:${hash_str})`;

   const profile = IccProfile.from_bytes(bytes);
   console.log({profile});

   const OPAQUE_LONG_ARRAYS = false; // true will break Export.

   const t = JSON.stringify(
      profile,
      (k, v) => {
         if (ArrayBuffer.isView(v)) return [].slice.call(v);
         if (OPAQUE_LONG_ARRAYS && v.length > 100) {
            return `${v.constructor.name}(${v.length})`;
         }
         return v;
      },
      3
   );
   e_text.value = t;
});
e_export.addEventListener('click', async e => {
   const t = e_text.value;
   const p = JSON.parse(t);

   const bytes = IccProfile.to_bytes(p);
   const hash_bytes = new Uint8Array(await crypto.subtle.digest('sha-256', bytes));
   const hash_str = hex_from_view(hash_bytes);
   e_export_hash.textContent = `(sha-256:${hash_str})`;

   const ICC_PROFILE_MIME = 'application/vnd.iccprofile';
   const blob = new Blob([bytes], {type: ICC_PROFILE_MIME});
   const file_name = e_export_name.value || 'profile.icc';
   download_blob(file_name, blob);
});
